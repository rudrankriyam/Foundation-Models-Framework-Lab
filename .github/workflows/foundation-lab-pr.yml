name: Foundation Lab PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'BookPlaygrounds/**'
      - 'Foundation Lab/**'
      - 'Foundation Lab Watch/**'
      - 'Foundation Lab TV/**'
      - 'FoundationLabCore/**'
      - 'FoundationLab.xcodeproj/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'SampleCode.xcconfig'
      - 'Tools/BookPlaygrounds/**'
      - '.github/workflows/foundation-lab-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-lab-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Build and test FoundationLabCore
        run: swift test

      - name: Typecheck book playgrounds
        run: bash Tools/BookPlaygrounds/typecheck.sh

      - name: Build Foundation Lab for iOS with embedded watch app
        run: |
          xcodebuild \
            -project FoundationLab.xcodeproj \
            -scheme 'Foundation Lab' \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Foundation Lab TV
        run: |
          xcodebuild \
            -project FoundationLab.xcodeproj \
            -scheme 'Foundation Lab TV' \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
